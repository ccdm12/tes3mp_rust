[package]
name = "client"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
build = "build.rs"


[dependencies]
bevy = { workspace = true, features = ["bevy_asset", "bevy_render", "bevy_winit", "bevy_core_pipeline", "bevy_pbr", "bevy_scene", "bevy_text", "bevy_ui", "ui_picking", "bevy_animation", "bevy_ui_render", "png", "hdr", "default_font", "tonemapping_luts", "bevy_state", "multi_threaded", "bevy_animation",  "tga", "reflect_auto_register","bevy_gizmos", "bevy_gizmos_render", "bevy_curve", "bevy_ui_widgets","zstd_rust"] }


esm_parser_lib = { workspace = true }
bevy_nif = { workspace = true }
to_utf8 = { workspace = true }
common = { workspace = true }
getrandom = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_v4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
bincode = { workspace = true }
unordered_map.workspace = true

bevy_anti_alias = { workspace = true }
serde = { workspace = true }
#networking = { workspace = true }
serializer = { path = "../../crates/serializer" }
bytes = "1.11.1"
toml = "1.1.2"
glam.workspace = true
avian3d = { workspace = true }
bitflags.workspace = true
rand = "0.10.1"
either = "1.16.0"
esm_store = { path = "../../crates/esm_store" }
strum = "0.28.0"
bevy_renet.workspace = true
networking.workspace = true
strum_macros.workspace = true
bevy_kira_audio = {version = "0.27.1", features = ["wav"]}
web-time = "1.1.0"


bevy-inspector-egui = {version = "0.38.0", optional = true }
bevy_egui = {version = "0.43.1", optional = true }

web-sys = {version ="0.3.106", optional = true}


[lints]
workspace = true

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]
linker = "x86_64-w64-mingw32-gcc"



[features]
default = ["desktop-x11"]

desktop-x11 = ["bevy/x11", "bevy/dynamic_linking" ]
webgl = ["bevy/web", "bevy/webgl2", "web-sys"]
debug_inspector = ["dep:bevy-inspector-egui", "dep:bevy_egui"]
debug_physics_render = []

